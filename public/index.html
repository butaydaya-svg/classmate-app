<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#534AB7">
  <title>ClassCheck — Classroom Assessment</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="landing-hero">
    <div class="landing-logo">ClassCheck</div>
    <p class="landing-tagline">Live formative assessment for your classroom</p>

    <div class="role-cards">
      <button class="role-card" onclick="location.href='/teacher.html'">
        <span class="role-icon">🎓</span>
        <div>
          <div class="role-title">I am a Teacher</div>
          <div class="role-desc">Create a session, ask questions, see live results</div>
        </div>
      </button>
      <button class="role-card" onclick="location.href='/student.html'">
        <span class="role-icon">📱</span>
        <div>
          <div class="role-title">I am a Student</div>
          <div class="role-desc">Join with a PIN and respond to questions</div>
        </div>
      </button>
    </div>

    <p style="margin-top: 40px; font-size: 12px; color: var(--text-muted);">All responses are anonymous</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
